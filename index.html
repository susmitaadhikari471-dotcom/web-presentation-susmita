<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Susmita Adhikari | Personal Space</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Background Blur Orbs -->
  <div class="blur-glow orb-1"></div>
  <div class="blur-glow orb-2"></div>

  <!-- Main Container -->
  <div class="portfolio-card">
    
    <!-- Profile Picture Section -->
    <div class="avatar-wrapper">
      <img src="profile.jpg.jpg" alt="Susmita Adhikari" class="profile-pic">
      <div class="status-badge"><span></span> Active</div>
    </div>

    <!-- Intro Header -->
    <h1 class="name">Susmita Adhikari</h1>
    <p class="tagline">Computer Engineering Student @ STU</p>

    <!-- Welcome Message Box -->
    <div class="welcome-box">
      <p class="greeting">✨ Welcome to my creative space!</p>
      <p class="bio">
        Passionate about web development, building intuitive software solutions, and crafting clean user experiences.
      </p>
    </div>

    <!-- Interactive Button -->
    <div class="action-area">
      <button id="demoBtn" type="button" class="glow-btn">
        <span>Say Hello 👋</span>
      </button>
      <p id="welcomeMsg" class="dynamic-msg"></p>
    </div>

    <!-- Quick Links / Skills Pills -->
    <div class="pills-container">
      <span class="pill">💻 Web Dev</span>
      <span class="pill">🐍 Python</span>
      <span class="pill">⚙️ Engineering</span>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
